<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="container">
        <button type="button" id="botao-tema" class="tema">🌙 Modo escuro</button>
    <h1>Lista de Tarefas</h1>

    <form id="form-tarefa">
      <input type="text" id="input-tarefa" placeholder="O que você precisa fazer?" required>
      <button type="submit">Adicionar</button>
    </form>

        <div class="filtros">
      <button type="button" class="filtro ativo" data-filtro="todas">Todas</button>
      <button type="button" class="filtro" data-filtro="pendentes">Pendentes</button>
      <button type="button" class="filtro" data-filtro="concluidas">Concluídas</button>
    </div>

    <ul id="lista-tarefas"></ul>
  </main>

  
  <script src="script.js"></script>

</body>

</html>
